{{- if .Values.cwsstore.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ocws.fullname" . }}-cwsstore
  labels:
    {{- include "ocws.labels" . | nindent 4 }}
    app.kubernetes.io/component: cwsstore
spec:
  type: {{ .Values.cwsstore.service.type }}
  ports:
    - port: {{ .Values.cwsstore.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "ocws.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cwsstore
{{- end }}
