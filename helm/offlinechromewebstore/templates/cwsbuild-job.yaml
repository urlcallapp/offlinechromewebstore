{{- if .Values.cwsbuild.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ocws.fullname" . }}-cwsbuild
  labels:
    {{- include "ocws.labels" . | nindent 4 }}
    app.kubernetes.io/component: cwsbuild
  annotations:
    # Rebuild the catalog after every install/upgrade, once the mirror exists.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ocws.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cwsbuild
    spec:
      {{- include "ocws.openshiftPod" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: cwsbuild
          {{- include "ocws.openshiftContainer" . | nindent 10 }}
          image: {{ include "ocws.image" (dict "registry" $.Values.registry "repository" .Values.cwsbuild.image.repository "tag" .Values.cwsbuild.image.tag) }}
          imagePullPolicy: {{ .Values.cwsbuild.image.pullPolicy }}
          env:
            - name: CWS_ARTIFACTS_DIR
              value: /app/artifacts
            - name: CWS_ASSETS_DIR
              value: /app/assets
            - name: CWS_INTAKE_DIR
              value: /app/intake
            {{- range $key, $value := .Values.cwsbuild.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.openshift.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            - name: artifacts
              mountPath: /app/artifacts
            - name: assets
              mountPath: /app/assets
            - name: intake
              mountPath: /app/intake
              readOnly: true
          {{- with .Values.cwsbuild.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.openshift.enabled }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "ocws.fullname" . }}-artifacts
        - name: assets
          persistentVolumeClaim:
            claimName: {{ include "ocws.fullname" . }}-assets
        - name: intake
          persistentVolumeClaim:
            claimName: {{ include "ocws.fullname" . }}-intake
{{- end }}
