apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ocws.fullname" . }}-artifacts
  annotations:
    # The mirrored content is expensive to reproduce in an air-gapped
    # environment; do not let helm uninstall delete it.
    helm.sh/resource-policy: keep
  labels:
    {{- include "ocws.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.artifacts.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ocws.fullname" . }}-assets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ocws.labels" . | nindent 4 }}
spec:
