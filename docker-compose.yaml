services:
  cwssync:
    build:
      context: .
      dockerfile: cwsoffline/cwssync/Dockerfile
    image: cwssync
    volumes:
      - ./artifacts:/app/artifacts
    stdin_open: true
    tty: true

  cwsbuild:
    build:
      context: .
      dockerfile: cwsoffline/cwsbuild/Dockerfile
    image: cwsbuild
    volumes:
      - ./artifacts:/app/artifacts
      - ./intake:/app/intake
      - ./assets:/app/assets
    stdin_open: true
    tty: true

  cwsstore:
    build:
      context: ./cwsoffline/cwsstore
      dockerfile: ./Dockerfile
    image: cwsstore
    volumes:
      - ./artifacts:/store/artifacts:ro
      - ./intake:/store/intake
      - ./assets:/store/assets:ro
    ports:
      - "8005:8005"
    stdin_open: true
    tty: true
