services:
  cwsbuild:
    build:
      context: .
      dockerfile: cwsoffline/cwsbuild/Dockerfile
    image: cwsbuild
    # Local CRX extraction/indexing must not use an online service.
    network_mode: none
    volumes:
      - ./artifacts:/app/artifacts
      - ./intake:/app/intake
      - ./assets:/app/assets
    stdin_open: true
    tty: true

  cwsstore:
    build:
      context: ./cwsoffline/cwsstore
      dockerfile: ./Dockerfile
    image: cwsstore
    volumes:
      - ./artifacts:/store/artifacts
      - ./intake:/store/intake
      - ./assets:/store/assets
    ports:
      - "8005:8005"
    stdin_open: true
    tty: true
